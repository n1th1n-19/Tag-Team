name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --with claude-swap python tests/test_tagteam.py
        shell: bash
      - run: uv tool install --python 3.12 . && tagteam --version
        shell: bash

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 scripts/package.py
      - name: Publish release with the three downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/tag-team-macos.zip dist/tag-team-linux.zip dist/tag-team-windows.zip dist/tag-team.vsix \
            --title "Tag Team Wrestling $GITHUB_REF_NAME" --generate-notes
