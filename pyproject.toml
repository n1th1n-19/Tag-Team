[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tag-team"
version = "0.4.6"
description = "Tag Team Wrestling for Claude Code: your work and personal Claude accounts side by side, with usage life bars, a match history of your token use and one-click switching, built on claude-swap"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["claude-swap>=0.26"]

[project.scripts]
tagteam = "tagteam.cli:main"
swapme = "tagteam.cli:legacy_main"

[tool.hatch.build.targets.wheel]
packages = ["tagteam"]
